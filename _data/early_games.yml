- id: steamcopter
  title: SteamCopter
  url: /early-games/steamcopter/
  subtitle: How far can you fly?
  year: 2015
  engine: libGDX
  status: Delisted
  platforms:
    - Android
  summary: >-
    Fly a steampunk helicopter through five worlds and see how far you get.
  description: Five Worlds. One Steampunk Helicopter.
  banner: /assets/libgdx/steamcopter/steamcopter-banner.webp
  screenshots:
    - /assets/libgdx/steamcopter/steamcopter-1.webp
    - /assets/libgdx/steamcopter/steamcopter-2.webp
    - /assets/libgdx/steamcopter/steamcopter-3.webp
  body:
    - >-
      SteamCopter is a simple game, which you won't easily get bored with. Grab
      the reins and explore five colorful worlds. Avoid obstacles and monsters
      to fly as far as possible. Collect stars to get the highest score.
    - And don't give up - you can always try again!
  bullets:
    - Available in two modes, HD and SD (optimized for slower devices)
    - >-
      Fully localized (English, French, German, Lithuanian, Polish, Russian,
      Spanish)
