- id: dont-scream
  title: Don't Scream
  url: /early-games/dont-scream/
  subtitle: shhh....
  year: 2015
  engine: libGDX
  status: Delisted
  platforms:
    - Android
  summary: >-
    Atmospheric mobile arcade game that will send shivers down your spine.
  description: >-
    Playing a horror game in the middle of the night was fun until you started
    to feel a strange, cold breath on the back of your neck...
  banner: /assets/libgdx/dont_scream/dont-scream-banner.webp
  screenshots:
    - /assets/libgdx/dont_scream/dont-scream-1.webp
    - /assets/libgdx/dont_scream/dont-scream-2.webp
    - /assets/libgdx/dont_scream/dont-scream-3.webp
    - /assets/libgdx/dont_scream/dont-scream-4.webp
  body:
    - >-
      Atmospheric mobile arcade game that will send shivers down your spine. Try
      to stay sane as long as you can. Just stay quiet and you'll be fine.
    - >-
      And remember - when reality becomes overwhelming, you can always try
      closing your eyes.

- id: steam-hero
  title: "Steam Hero: Rope of Hope"
  url: /early-games/steam-hero/
  subtitle: Hook, swing, repeat.
  year: 2015
  engine: libGDX
  status: Delisted
  platforms:
    - Android
  summary: >-
    Swing from one platform to the next on a single rope. Simple yet addictive.
  description: >-
    Equipped with nothing more than a single rope, swing from one platform to
    another.
  banner: /assets/libgdx/steam_hero/steam-hero-banner.webp
  screenshots:
    - /assets/libgdx/steam_hero/steam-hero-1.webp
    - /assets/libgdx/steam_hero/steam-hero-2.webp
    - /assets/libgdx/steam_hero/steam-hero-3.webp
    - /assets/libgdx/steam_hero/steam-hero-4.webp
  body:
    - >-
      Hold your finger to move the grapple point, release to swing. Stick with
      the crows - they are said to spawn bonuses. But be careful! If the rope is
      too short or too long, you will fall.
    - Simple yet addictive, just try it!
    - >-
      Compete with your friends and people from all over the world through
      online leaderboards and achievements.
    - Collect coins to unlock additional backgrounds and characters.
    - Play in headphones for best experience.

