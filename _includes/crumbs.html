<nav class="crumbs" aria-label="Breadcrumb">
  <ol>
    <li class="home"><a href="{{ '/' | relative_url }}">
      <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor"
           stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true" focusable="false">
        <path d="M1.9 6.9 8 2l6.1 4.9"/>
        <path d="M3.4 6.3v6.2c0 .3.3.6.6.6h8c.3 0 .6-.3.6-.6V6.3"/>
      </svg>
      <span class="sr-only">{{ site.title }} home</span>
    </a></li>
    {% if include.l1 %}<li><a href="{{ include.l1_url | relative_url }}">{{ include.l1 }}</a></li>{% endif %}
    <li aria-current="page">{{ include.current }}</li>
  </ol>
</nav>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {"@type": "ListItem", "position": 1, "name": {{ site.title | jsonify }}, "item": {{ '/' | absolute_url | jsonify }}}
    {%- if include.l1 -%}
    ,{"@type": "ListItem", "position": 2, "name": {{ include.l1 | jsonify }}, "item": {{ include.l1_url | absolute_url | jsonify }}},
    {"@type": "ListItem", "position": 3, "name": {{ include.current | jsonify }}}
    {%- else -%}
    ,{"@type": "ListItem", "position": 2, "name": {{ include.current | jsonify }}}
    {%- endif -%}
  ]
}
</script>
